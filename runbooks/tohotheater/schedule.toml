service = "tohotheater"
name = "schedule"
goal = "TOHOシネマズのサイトで {area} にある {theater} の {date} の上映スケジュールを表示する。表示したところで止める。"
start_url = "https://www.tohotheater.jp/"
status = "approved"
sources = ["demo:runs/20261103T170429/learn-tohotheater-schedule.jsonl"]
skip = ["footer"]

[params.area]
description = "劇場一覧での地区名（例: 関東地区）"

[params.theater]
description = "劇場名（例: TOHOシネマズ 日比谷）"

[params.date]
description = "上映日。日付タブの表記 M/D（例: 11/6）"

[[steps]]
instruction = "Cookie の同意バナーが出ていれば「全てのCookieを受け入れる」を押す"
hints = ["バナーが出ていなければこの手順は不要"]
done_when = "Cookie の同意バナーが表示されていない"

[[steps]]
instruction = "「すべての劇場」を押して劇場一覧ページを開く"
done_when = "劇場一覧（Theater List）の地区の見出しが並んでいる"

[[steps]]
instruction = "{area} の見出しを押して展開する"
hints = ["地区は折りたたまれていて、押すまで劇場名は表示されない", "地区の見出しは最初の画面より下にあり、スクロールするまで押せない"]
done_when = "{theater} の劇場名が表示されている"

[[steps]]
instruction = "{theater} を押してその劇場の上映スケジュールを開く"
done_when = "ページの劇場名が {theater} で、日付タブが並んでいる"

[[steps]]
instruction = "日付タブ {date} を押す"
hints = ["日付タブの割引サービス名は日付の選択に関係しない", "劇場のページを開いた直後は今日のスケジュールが表示されている。{date} のタブを押すまで見出しは変わらない", "日付タブはページの下の方にあり、スクロールが必要"]
done_when = "スケジュールの見出しが {date} の日付（例: 11/6 なら「11月6日(金)」）になり、作品と上映時刻が表示されている"
