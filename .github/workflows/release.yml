name: release

# Publishes to npm when a GitHub Release is published. No npm token: npm trusted publishing (OIDC)
# authenticates this workflow and adds provenance. Register it on npmjs.com under the package's
# settings: repository sakamoto66/webhand, workflow release.yml, environment npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the versions and is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
            const manifests = [
              ".claude-plugin/plugin.json",
              ".antigravity-plugin/plugin.json",
              ".codex-plugin/plugin.json",
            ];
            const tag = process.env.TAG;
            const mismatches = manifests
              .map((path) => [path, JSON.parse(readFileSync(path, "utf8")).version])
              .filter(([, version]) => version !== pkg);
            if (tag !== `v${pkg}` || mismatches.length > 0) {
              const found = mismatches.map(([p, v]) => `${p} ${v}`).join(", ");
              console.error(`tag ${tag}, package.json ${pkg}${found ? `, ${found}` : ""}: they must all match (tag v${pkg})`);
              process.exit(1);
            }
          '
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
      - run: npm ci
      # Runs both the `unit` and `browser` Vitest projects.
      - run: npm test
      # prepublishOnly runs npm run check, the build, and npm run check:package.
      - run: npm publish
