[project]
name = "webhand"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx[http2]>=0.28.1",
    "playwright>=1.64.1",
]

[project.scripts]
webhand = "webhand.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhand"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
